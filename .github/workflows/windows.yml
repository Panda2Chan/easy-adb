name: Windows build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/EasyAdb.Tests.csproj -c Release
      - run: dotnet publish src/EasyAdb.Windows -c Release -r win-x64 --self-contained true -o out
      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path out/EasyAdb.exe)) { throw 'Missing EasyAdb.exe' }
          Copy-Item README.md out
      - uses: actions/upload-artifact@v4
        with:
          name: easy-adb-win-x64
          path: out/
